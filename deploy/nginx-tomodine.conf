# /etc/nginx/sites-available/tomodine
# Nginx reverse proxy for TomoDine (Gunicorn + Daphne + static React)
#
# This config starts HTTP-only. After running:
#   sudo certbot --nginx -d www.tomodine.com
# Certbot will automatically add SSL and HTTPS server blocks.

upstream django_http {
    server 127.0.0.1:8000;
}

upstream django_ws {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN YOUR_EC2_PUBLIC_IP;

    # --- Security headers ---
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # --- Force UTF-8 charset for all text responses ---
    charset utf-8;
    charset_types text/plain text/css application/json application/javascript text/xml application/xml;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # --- Client max body size (image uploads) ---
    client_max_body_size 10M;

    # --- Django API + admin (HTTP) ---
    location /api/ {
        proxy_pass http://django_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_set_header Accept-Charset "utf-8";
    }

    location /admin/ {
        proxy_pass http://django_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django WebSocket (Daphne) ---
    location /api/ws/ {
        proxy_pass http://django_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Django static files (WhiteNoise serves these) ---
    location /static/ {
        alias /opt/tomodine/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- React SPA (frontend build) ---
    location / {
        root /opt/tomodine/frontend/dist;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
