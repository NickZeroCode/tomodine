services:
  # Redis backs the Django Channels channel layer in production.
  # Set USE_REDIS_CHANNEL_LAYER=true and REDIS_URL=redis://localhost:6379/0
  # (or redis://redis:6379/0 when the app itself runs in compose).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
